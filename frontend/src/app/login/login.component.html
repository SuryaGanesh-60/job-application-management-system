<div class="login-page">

  <div class="login-card">

    <div class="login-icon">
      💼
    </div>

    <h1>Job Application</h1>

    <p class="subtitle">
      Management System
    </p>

    <h2>Admin Login</h2>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter admin email"
          required
        >

      </div>

      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter password"
          required
        >

      </div>

      <button
        type="submit"
        class="login-btn">
        🔐 Login
      </button>

    </form>

    <p class="login-info">
      Admin access only
    </p>

  </div>

</div>
