<div class="admin-page">

  <header class="admin-header">

    <div>
      <h1>Admin Dashboard</h1>
      <p>Job Application Management System</p>
    </div>

    <button
      class="logout-btn"
      (click)="logout()">
      🚪 Logout
    </button>

  </header>

  <main class="admin-content">

    <h2>Welcome, Admin 👋</h2>

    <p>
      You have successfully logged in to the Admin Panel.
    </p>

    <div class="admin-cards">

      <div class="admin-card">
        <h3>👥 Users</h3>
        <p>Manage registered users</p>
      </div>

      <div class="admin-card">
        <h3>💼 Applications</h3>
        <p>Manage job applications</p>
      </div>

      <div class="admin-card">
        <h3>📊 Reports</h3>
        <p>View application statistics</p>
      </div>

    </div>

  </main>

</div>
